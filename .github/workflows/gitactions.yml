name: Build and Deploy

on:
  push:
    branches:
      - main

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  FRONTEND_REPO: wpoms-abhinav-frontend
  BACKEND_REPO: wpoms-abhinav-backend
  S3_BUCKET: wpoms-abhinav-deploy-files

jobs:


  build:
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
      registry: ${{ steps.login-ecr.outputs.registry }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Generate Image Tag
        id: tag
        run: |
          TAG=${GITHUB_SHA::7}-$(date +%s)
          echo "image_tag=$TAG" >> $GITHUB_OUTPUT
          echo "IMAGE_TAG=$TAG" >> $GITHUB_ENV

     
      - name: Build & Push Frontend
        run: |
          docker build -t $FRONTEND_REPO:$IMAGE_TAG ./wpoms_web
          docker tag $FRONTEND_REPO:$IMAGE_TAG ${{ steps.login-ecr.outputs.registry }}/$FRONTEND_REPO:$IMAGE_TAG
          docker push ${{ steps.login-ecr.outputs.registry }}/$FRONTEND_REPO:$IMAGE_TAG


      - name: Build & Push Backend
        run: |
          docker build -t $BACKEND_REPO:$IMAGE_TAG ./wpoms_admin
          docker tag $BACKEND_REPO:$IMAGE_TAG ${{ steps.login-ecr.outputs.registry }}/$BACKEND_REPO:$IMAGE_TAG
          docker push ${{ steps.login-ecr.outputs.registry }}/$BACKEND_REPO:$IMAGE_TAG

   
      - name: Upload docker-compose to S3
        run: |
          aws s3 cp docker-compose.yml s3://$S3_BUCKET/docker-compose.yml



  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            set -e

            echo "Starting deployment..."

            export AWS_REGION=${{ secrets.AWS_REGION }}
            export S3_BUCKET=wpoms-abhinav-deploy-files
            export ECR_REGISTRY=${{ needs.build.outputs.registry }}
            export FRONTEND_REPO=wpoms-abhinav-frontend
            export BACKEND_REPO=wpoms-abhinav-backend
            export IMAGE_TAG=${{ needs.build.outputs.image_tag }}

            mkdir -p ~/app
            cd ~/app

            echo "Fetching docker-compose from S3..."
            aws s3 cp s3://$S3_BUCKET/docker-compose.yml docker-compose.yml

            echo "Fetching secrets from SSM..."
            export POSTGRES_DB=$(aws ssm get-parameter --name "/wpoms/POSTGRES_DB" --query "Parameter.Value" --output text)
            export POSTGRES_USER=$(aws ssm get-parameter --name "/wpoms/POSTGRES_USER" --query "Parameter.Value" --output text)
            export POSTGRES_PASSWORD=$(aws ssm get-parameter --name "/wpoms/POSTGRES_PASSWORD" --with-decryption --query "Parameter.Value" --output text)

            echo "Logging into ECR..."
            aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY

            echo "Deploying containers..."
            docker compose down || true
            docker compose pull
            docker compose up -d

            echo "Deployment successful"          