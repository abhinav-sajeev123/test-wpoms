name: Build and Deploy

on:
  push:
    branches:
      - main

env:
  FRONTEND_REPOSITORY: wpoms-abhinav-frontend
  BACKEND_REPOSITORY: wpoms-abhinav-backend
  S3_BUCKET: wpoms-abhinav-deploy-files

jobs:

  build:
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Generate Tag
        id: tag
        run: |
          TAG=${GITHUB_SHA::7}-$(date +%s)
          echo "image_tag=$TAG" >> $GITHUB_OUTPUT

      - name: Build & Push Frontend
        run: |
          IMAGE_TAG=${{ steps.tag.outputs.image_tag }}
          REGISTRY=${{ steps.login-ecr.outputs.registry }}

          docker build -t $FRONTEND_REPOSITORY:$IMAGE_TAG ./wpoms_web
          docker tag $FRONTEND_REPOSITORY:$IMAGE_TAG $REGISTRY/$FRONTEND_REPOSITORY:$IMAGE_TAG
          docker push $REGISTRY/$FRONTEND_REPOSITORY:$IMAGE_TAG

      - name: Build & Push Backend
        run: |
          IMAGE_TAG=${{ steps.tag.outputs.image_tag }}
          REGISTRY=${{ steps.login-ecr.outputs.registry }}

          docker build -t $BACKEND_REPOSITORY:$IMAGE_TAG ./wpoms_admin
          docker tag $BACKEND_REPOSITORY:$IMAGE_TAG $REGISTRY/$BACKEND_REPOSITORY:$IMAGE_TAG
          docker push $REGISTRY/$BACKEND_REPOSITORY:$IMAGE_TAG

      - name: Upload docker-compose to S3
        run: |
          aws s3 cp docker-compose.yml s3://$S3_BUCKET/docker-compose.yml

      - name: Upload deploy script to S3   
        run: |
          aws s3 cp deploy.sh s3://$S3_BUCKET/deploy.sh    


  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            set -e

            echo "Starting deployment..."

            export AWS_REGION=${{ secrets.AWS_REGION }}
            export IMAGE_TAG=${{ needs.build.outputs.image_tag }}

            mkdir -p ~/app
            cd ~/app

            aws s3 cp s3://&S3_BUCKET/deploy.sh deploy.sh

            chmod +x deploy.sh
            ./deploy.sh