name: Build and Push Images

on:
  push:
    branches:
      - main

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  FRONTEND_REPO: wpoms-abhinav-frontend
  BACKEND_REPO: wpoms-abhinav-backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Frontend Image
        run: |
          docker build -t $FRONTEND_REPO:${{ github.sha }} ./wpoms_web

      - name: Build Backend Image
        run: |
          docker build -t $BACKEND_REPO:${{ github.sha }} ./wpoms_admin

      - name: Tag Frontend Image
        run: |
          docker tag $FRONTEND_REPO:${{ github.sha }} \
          ${{ steps.login-ecr.outputs.registry }}/$FRONTEND_REPO:${{ github.sha }}

      - name: Tag Backend Image
        run: |
          docker tag $BACKEND_REPO:${{ github.sha }} \
          ${{ steps.login-ecr.outputs.registry }}/$BACKEND_REPO:${{ github.sha }}

      - name: Push Frontend Image
        run: |
          docker push \
          ${{ steps.login-ecr.outputs.registry }}/$FRONTEND_REPO:${{ github.sha }}

      - name: Push Backend Image
        run: |
          docker push \
          ${{ steps.login-ecr.outputs.registry }}/$BACKEND_REPO:${{ github.sha }}